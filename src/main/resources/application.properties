# ===================================================================
# CONFIGURACIÓN DE LA BASE DE DADES (H2 EN RUTA RELATIVA)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:marcapartment;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
server.port=${PORT:8080}
# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desactivamos el aviso amarillo de "open-in-view" para limpiar los logs
spring.jpa.open-in-view=false

# Permite que la consola web de H2 esté disponible si la necesitas
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# CONFIGURACIÓN DE AWS (OPCIONAL/SILENCIOSO)
# ===================================================================
# Si tu código de AWS falla al no encontrar credenciales, estas propiedades
# le dan valores vacíos por defecto en local para que no bloquee el arranque.
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:}